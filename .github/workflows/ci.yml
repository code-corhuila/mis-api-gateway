name: Gateway checks
on:
  pull_request:
    branches: [develop, qa]
permissions:
  contents: read
concurrency:
  group: gateway-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test gateway with disposable upstreams
        run: python tests/test_gateway.py
