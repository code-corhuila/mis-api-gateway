worker_processes auto;
worker_shutdown_timeout 20s;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /tmp/cors.conf;
    default_type application/json;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_header_timeout 5s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 30s;
    resolver 127.0.0.11 ipv6=off valid=1s;
    resolver_timeout 2s;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;
    map $request_id $generated_trace {
        "~^(?<trace_a>........)(?<trace_b>....)(?<trace_c>....)(?<trace_d>....)(?<trace_e>............)$" "$trace_a-$trace_b-$trace_c-$trace_d-$trace_e";
    }
    map $http_x_correlation_id $trace {
        default $generated_trace;
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_correlation_id;
    }
    map $http_x_correlation_id $bad_trace {
        default 1;
        "" 0;
        "~^[A-Za-z0-9._:-]{1,128}$" 0;
    }
    map $http_origin $origin_present { default 1; "" 0; }
    map "$origin_present:$cors_origin" $origin_denied { default 0; "1:" 1; }
    map $http_access_control_request_method $preflight_method {
        default 0;
        GET 1;
        POST 1;
        HEAD 1;
    }
    map "$request_method:$origin_present:$preflight_method" $bad_preflight {
        default 0;
        "OPTIONS:0:0" 1;
        "OPTIONS:0:1" 1;
        "OPTIONS:1:0" 1;
    }
    map $uri $backend {
        default "";
        /api/v1/auth/login security:8080;
        /api/v1/auth/me security:8080;
        /api/v1/auth/jwks security:8080;
        ~^/api/v1/medications(?:/[^/]+)?$ catalog:8080;
        ~^/api/v1/suppliers(?:/[^/]+)?$ suppliers:8080;
        ~^/api/v1/receipts(?:/[^/]+(?:/(?:confirm|void))?)?$ suppliers:8080;
        ~^/api/v1/entries(?:/[^/]+(?:/(?:activate|cancel))?)?$ inventory:8080;
        /api/v1/stock inventory:8080;
        /api/v1/movements inventory:8080;
        ~^/api/v1/exits(?:/[^/]+)?$ inventory:8080;
        /api/v1/sagas/receive-supplies workflow:8080;
        ~^/api/v1/sagas/[^/]+(?:/resume)?$ workflow:8080;
    }
    map "$uri:$backend" $unknown_route { default 0; ~:$ 1; "/health:" 0; }
    map $uri $protected {
        default 1;
        /health 0;
        /api/v1/auth/login 0;
        /api/v1/auth/jwks 0;
    }
    map $http_authorization $bearer_present { default 0; "~*^Bearer[[:space:]]+[^[:space:]]+$" 1; }
    map "$protected:$bearer_present" $missing_bearer { default 0; "1:0" 1; }
    map $status $retry_after { default ""; 429 "1"; }
    log_format audit escape=json '{"event":"gateway_request","traceId":"$trace","method":"$request_method","path":"$uri","status":$status,"upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout audit;
    server {
        listen 8080;
        add_header X-Correlation-Id $trace always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
        add_header Access-Control-Expose-Headers "Location, X-Correlation-Id, Retry-After" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Retry-After $retry_after always;
        add_header X-Content-Type-Options nosniff always;
        error_page 400 = @invalid;
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
        error_page 404 = @missing;
        error_page 408 = @timeout;
        error_page 413 = @body_large;
        error_page 429 = @rate_limited;
        error_page 500 = @internal;
        error_page 502 504 = @unavailable;
        if ($bad_trace) { return 400; }
        if ($origin_denied) { return 403; }
        if ($unknown_route) { return 404; }
        if ($bad_preflight) { return 400; }
        if ($request_method = OPTIONS) { return 204; }
        if ($missing_bearer) { return 401; }
        location = /health { return 200 '{"status":"UP"}'; }
        location / {
            limit_req zone=per_ip burst=20 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Correlation-Id $trace;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Correlation-Id;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 15s;
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_pass http://$backend$request_uri;
        }
        location @invalid { return 400 '{"error":"VALIDATION_ERROR","message":"Solicitud invalida.","traceId":"$trace"}'; }
        location @unauthorized { return 401 '{"error":"UNAUTHORIZED","message":"Autenticacion requerida.","traceId":"$trace"}'; }
        location @forbidden { return 403 '{"error":"FORBIDDEN","message":"Origen no permitido.","traceId":"$trace"}'; }
        location @missing { return 404 '{"error":"NOT_FOUND","message":"Ruta inexistente.","traceId":"$trace"}'; }
        location @timeout { return 408 '{"error":"REQUEST_TIMEOUT","message":"Tiempo de lectura agotado.","traceId":"$trace"}'; }
        location @body_large { return 413 '{"error":"PAYLOAD_TOO_LARGE","message":"Cuerpo demasiado grande.","traceId":"$trace"}'; }
        location @rate_limited { return 429 '{"error":"TOO_MANY_REQUESTS","message":"Limite de solicitudes excedido.","traceId":"$trace"}'; }
        location @internal { return 500 '{"error":"INTERNAL_ERROR","message":"Error interno.","traceId":"$trace"}'; }
        location @unavailable { return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Servicio no disponible.","traceId":"$trace"}'; }
    }
}
